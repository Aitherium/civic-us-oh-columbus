name: Add a town or city
description: Ask for a new jurisdiction repo. A maintainer generates it; nothing is created automatically.
title: "jurisdiction: "
labels: ["submission", "jurisdiction"]
body:
  - type: markdown
    attributes:
      value: |
        A bot turns this into a pull request. It only records what an official page
        says. Do not submit a home address, personal email, or personal phone number
        - it will be rejected.

        A new jurisdiction becomes its own repo, generated by `civic_repo_gen` from
        the Census of Governments listing. This form records the request; it does
        not create the repo.
  - type: input
    id: record-type
    attributes:
      label: Record type
      value: jurisdiction
      description: Leave as jurisdiction.
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: The incorporated name as the Census lists it.
      placeholder: City of Yucca Valley
    validations:
      required: true
  - type: input
    id: state
    attributes:
      label: State
      description: Two-letter postal code.
      placeholder: CA
    validations:
      required: true
  - type: input
    id: census-geoid
    attributes:
      label: Census GEOID
      description: Optional. The 7-digit place FIPS if you know it.
      placeholder: "0698704"
  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: The jurisdiction's own official website.
      placeholder: https://www.yucca-valley.org/
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: This is an incorporated local government, not a neighborhood or an unincorporated area.
          required: true

name: Report an error
description: Something here is wrong. A retraction is never a delete.
title: "error: "
labels: ["rectification"]
body:
  - type: markdown
    attributes:
      value: |
        A bot turns this into a pull request. It only records what an official page
        says. Do not submit a home address, personal email, or personal phone number
        - it will be rejected.

        Name the record and say what is wrong. The fix lands as a pull request; the
        old record stays in the history and the correction says why.
  - type: input
    id: record-type
    attributes:
      label: Record type
      value: error
      description: Leave as error.
    validations:
      required: true
  - type: input
    id: record-id
    attributes:
      label: Record ID
      description: The record's id, or its file path under records/.
      placeholder: official:ocd-person/05bfbd24-9dc6-4fbb-9ae9-ecd2446eb7f7/2022-01-03
    validations:
      required: true
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What is wrong
      description: One or two sentences. If a source shows the correct value, cite it.
      placeholder: The mayor's term ends 2026-12-11, not 2027-01-01.
    validations:
      required: true
  - type: input
    id: source-url
    attributes:
      label: Source URL
      description: The page that shows the correct value.
      placeholder: https://lacity.gov/mayor
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am not asking to remove a published record, only to correct it.
          required: true
